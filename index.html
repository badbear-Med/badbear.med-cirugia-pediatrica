<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso | BADBEAR.MED Cirugía Pediátrica</title>
  <link rel="icon" type="image/png" href="assets/logo/badbear-logo.png">
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #f7f9fd 0%, #eef3ff 55%, #f8f5ff 100%);
      color: #0d1b3e;
    }
    .acceso {
      width: min(460px, 100%);
      background: rgba(255,255,255,.96);
      border: 1px solid #e3e8f2;
      border-radius: 24px;
      padding: 34px;
      box-shadow: 0 24px 70px rgba(13,27,62,.12);
      text-align: center;
    }
    .logo {
      width: 78px;
      height: 78px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    .marca {
      margin: 0;
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.8px;
    }
    .marca span { color: #2962ff; }
    .curso {
      margin: 8px 0 24px;
      color: #68758d;
      font-weight: 700;
      font-size: 14px;
    }
    .etiqueta {
      display: inline-block;
      margin-bottom: 10px;
      color: #2962ff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.4px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    .descripcion {
      margin: 0 0 24px;
      color: #66738a;
      font-size: 14px;
      line-height: 1.5;
    }
    label {
      display: block;
      text-align: left;
      margin-bottom: 8px;
      color: #45536d;
      font-size: 13px;
      font-weight: 800;
    }
    .campo {
      position: relative;
    }
    input {
      width: 100%;
      height: 50px;
      padding: 0 48px 0 15px;
      border: 1px solid #d9e0ec;
      border-radius: 13px;
      outline: none;
      font-size: 16px;
      color: #0d1b3e;
      background: #fff;
    }
    input:focus {
      border-color: #2962ff;
      box-shadow: 0 0 0 4px rgba(41,98,255,.10);
    }
    .ver {
      position: absolute;
      right: 8px;
      top: 7px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 9px;
      background: #f2f5fb;
      color: #56637a;
      cursor: pointer;
      font-size: 16px;
    }
    .ingresar {
      width: 100%;
      min-height: 50px;
      margin-top: 14px;
      border: 0;
      border-radius: 13px;
      background: #0d1b3e;
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }
    .ingresar:hover { background: #162a59; }
    .ingresar:disabled { opacity: .65; cursor: wait; }
    .error {
      min-height: 21px;
      margin: 11px 0 0;
      color: #c62828;
      font-size: 13px;
      font-weight: 700;
    }
    .pie {
      margin: 22px 0 0;
      padding-top: 18px;
      border-top: 1px solid #edf0f5;
      color: #8a94a8;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main class="acceso">
    <img class="logo" src="assets/logo/badbear-logo.png" alt="BADBEAR.MED">
    <h1 class="marca">BADBEAR<span>.MED</span></h1>
    <p class="curso">Cirugía Pediátrica</p>

    <span class="etiqueta">ACCESO RESTRINGIDO</span>
    <h2>Contenido protegido</h2>
    <p class="descripcion">Ingresa la clave para acceder al banco, teoría, progreso y exámenes pasados.</p>

    <form id="form-acceso" autocomplete="off">
      <label for="clave">Clave de acceso</label>
      <div class="campo">
        <input id="clave" name="clave" type="password" autocomplete="current-password" required autofocus>
        <button class="ver" id="ver-clave" type="button" aria-label="Mostrar u ocultar clave">👁</button>
      </div>
      <button class="ingresar" id="btn-ingresar" type="submit">Ingresar</button>
      <p class="error" id="mensaje-error" aria-live="polite"></p>
    </form>

    <p class="pie">BADBEAR.MED · Proyecto del grupo WAJOMEA</p>
  </main>

  <script>
    (() => {
      const ACCESS_KEY = "badbear_med_cx_access_v1";
      const TARGET = "curso-cx-bbmed-8f4c2.html";
      const EXPECTED_HASH = "b45bcabfa9d996115a02b549dbdc9a8d99546c4c1a345397a754c5ebd55eacd7";

      if (sessionStorage.getItem(ACCESS_KEY) === "ok") {
        location.replace(TARGET);
        return;
      }

      const form = document.getElementById("form-acceso");
      const input = document.getElementById("clave");
      const error = document.getElementById("mensaje-error");
      const button = document.getElementById("btn-ingresar");
      const toggle = document.getElementById("ver-clave");

      toggle.addEventListener("click", () => {
        input.type = input.type === "password" ? "text" : "password";
      });

      async function sha256(text) {
        const data = new TextEncoder().encode(text);
        const digest = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(digest))
          .map(byte => byte.toString(16).padStart(2, "0"))
          .join("");
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        error.textContent = "";
        button.disabled = true;
        button.textContent = "Verificando…";

        try {
          const hash = await sha256(input.value.trim());
          if (hash === EXPECTED_HASH) {
            sessionStorage.setItem(ACCESS_KEY, "ok");
            location.replace(TARGET);
            return;
          }

          error.textContent = "Clave incorrecta. Inténtalo nuevamente.";
          input.select();
        } catch (e) {
          error.textContent = "No se pudo verificar la clave. Recarga la página.";
        } finally {
          button.disabled = false;
          button.textContent = "Ingresar";
        }
      });
    })();
  </script>
</body>
</html>
